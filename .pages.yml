      - { name: s4Title, label: 項目4の見出し, type: string }
      - { name: s4Text, label: 項目4の文章, type: text }
      - { name: s5Title, label: 項目5の見出し, type: string }
      - { name: s5Text, label: 項目5の文章, type: text }

  - name: values
    label: Linkが大切にすること
    type: file
    path: content/values.json
    fields:
      - { name: detailTitle, label: 詳細セクションの見出し, type: string }
      - { name: detail1Title, label: 詳細1の見出し, type: string }
      - { name: detail1Text, label: 詳細1の本文, type: text }
      - { name: detail2Title, label: 詳細2の見出し, type: string }
      - { name: detail2Text, label: 詳細2の本文, type: text }
      - { name: detail3Title, label: 詳細3の見出し, type: string }
      - { name: detail3Text, label: 詳細3の本文, type: text }
