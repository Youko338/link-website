      - { name: detail1Title, label: 詳細1の見出し, type: string }
      - { name: detail1Text, label: 詳細1の本文, type: text }
      - { name: detail2Title, label: 詳細2の見出し, type: string }
      - { name: detail2Text, label: 詳細2の本文, type: text }
      - { name: bannerImage, label: バナー画像, type: image }
      - { name: lead, label: リード文, type: text }
      - { name: card1Title, label: カード1の見出し, type: string }
      - { name: card1Text, label: カード1の説明, type: text }
      - { name: card2Title, label: カード2の見出し, type: string }
      - { name: card2Text, label: カード2の説明, type: text }
      - { name: banner1Title, label: バナー1の見出し, type: string }
      - { name: banner1Text, label: バナー1の説明, type: string }
      - { name: banner2Title, label: バナー2の見出し, type: string }
      - { name: banner2Text, label: バナー2の説明, type: string }
      - { name: banner3Title, label: バナー3の見出し, type: string }
      - { name: banner3Text, label: バナー3の説明, type: string }
  - name: recruit
    label: 採用情報
    type: file
    path: content/recruit.json
    fields:
      - { name: detailTitle, label: 詳細セクションの見出し, type: string }
      - { name: detail1Title, label: 詳細1の見出し, type: string }
      - { name: detail1Text, label: 詳細1の本文, type: text }
      - { name: detail2Title, label: 詳細2の見出し, type: string }
      - { name: detail2Text, label: 詳細2の本文, type: text }
      - { name: bannerImage, label: バナー画像, type: image }
      - { name: headingLine1, label: 見出し（1行目）, type: string }
      - { name: headingLine2, label: 見出し（2行目）, type: string }
      - { name: lead, label: リード文, type: text }
      - { name: noticeTag, label: お知らせ枠のラベル, type: string }
      - { name: noticeTitle, label: お知らせ枠の見出し, type: string }
      - { name: noticeText, label: お知らせ枠の文章, type: text }
  - name: news
    label: お知らせ
    type: file
    path: content/news.json
    fields:
      - { name: detailTitle, label: 詳細セクションの見出し, type: string }
      - { name: detail1Title, label: 詳細1の見出し, type: string }
      - { name: detail1Text, label: 詳細1の本文, type: text }
      - { name: detail2Title, label: 詳細2の見出し, type: string }
      - { name: detail2Text, label: 詳細2の本文, type: text }
      - { name: bannerImage, label: バナー画像, type: image }
      - { name: lead, label: リード文, type: text }
      - { name: note, label: 一覧の下の注釈, type: string }
      - name: items
        label: お知らせ一覧（上が新しい順に並べてください）
        type: object
        list: true
        fields:
          - { name: date, label: 日付（例 2026-11-10）, type: string }
          - { name: tag, label: 分類（例 お知らせ／採用）, type: string }
          - { name: title, label: タイトル, type: string }
  - name: contact
    label: お問い合わせ
    type: file
    path: content/contact.json
    fields:
      - { name: detailTitle, label: 詳細セクションの見出し, type: string }
      - { name: detail1Title, label: 詳細1の見出し, type: string }
      - { name: detail1Text, label: 詳細1の本文, type: text }
      - { name: detail2Title, label: 詳細2の見出し, type: string }
      - { name: detail2Text, label: 詳細2の本文, type: text }
      - { name: bannerImage, label: バナー画像, type: image }
      - { name: lead, label: リード文, type: text }
      - { name: noticeTag, label: 枠のラベル, type: string }
      - { name: noticeTitle, label: 枠の見出し, type: string }
      - { name: noticeText, label: 枠の文章, type: text }
  - name: privacy
    label: プライバシーポリシー
    type: file
    path: content/privacy.json
    fields:
      - { name: detailTitle, label: 詳細セクションの見出し, type: string }
      - { name: detail1Title, label: 詳細1の見出し, type: string }
      - { name: detail1Text, label: 詳細1の本文, type: text }
      - { name: bannerImage, label: バナー画像, type: image }
