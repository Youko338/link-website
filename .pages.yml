# Pages CMS 設定（フォーム編集用・コード不要）
# 文章は content/*.json に入っています。Pages CMSでは入力フォームとして表示されます。
# HTMLファイル自体は登録していません（コードを見なくて済むようにするため）。

media:
  input: assets
  output: /assets

content:
  - name: settings
    label: デザイン設定
    type: file
    path: content/settings.json
    fields:
      - { name: textSize, label: 本文の文字サイズ（数字・12〜20）, type: number }
      - name: bodyLineHeight
        label: 本文の行間
        type: select
        options:
          values:
            - { label: 狭い（1.6）, value: "1.6" }
            - { label: やや狭い（1.75）, value: "1.75" }
            - { label: 標準（1.9）, value: "1.9" }
            - { label: やや広い（2.05）, value: "2.05" }
            - { label: 広い（2.2）, value: "2.2" }
      - { name: heroTitleSize, label: トップの大見出しサイズ（数字・40〜110）, type: number }
      - { name: titleSize, label: 各ページの見出しサイズ（数字・26〜64）, type: number }
      - name: titleLineHeight
        label: 見出しの行間
        type: select
        options:
          values:
            - { label: 狭い（1.2）, value: "1.2" }
            - { label: 標準（1.35）, value: "1.35" }
            - { label: 広い（1.5）, value: "1.5" }
      - name: textColor
        label: 本文の文字色
        type: select
        options:
          values:
            - { label: 標準（濃い紺グレー）, value: "#17314d" }
            - { label: しっかり黒, value: "#101418" }
            - { label: やわらかめ, value: "#3c4c5c" }
      - name: headingColor
        label: 見出しの色
        type: select
        options:
          values:
            - { label: 標準（濃い紺グレー）, value: "#17314d" }
            - { label: 濃紺, value: "#0b243f" }
            - { label: 青, value: "#1478bd" }
      - name: accentColor
        label: アクセント色（リンク・ボタンなど）
        type: select
        options:
          values:
            - { label: 標準の青, value: "#1478bd" }
            - { label: 明るい青, value: "#1d95d8" }
            - { label: 緑, value: "#2e9e6b" }
            - { label: 落ち着いた紺, value: "#0f4c81" }
      - name: sectionPadding
        label: ページの余白の広さ
        type: select
        options:
          values:
            - { label: コンパクト, value: "76" }
            - { label: 標準, value: "100" }
            - { label: ゆったり, value: "120" }
      - { name: heroBgImage, label: トップの背景画像（空なら今まで通り）, type: image }
  - name: home
    label: トップ
    type: file
    path: content/home.json
    fields:
      - { name: heroTitleLine1, label: キャッチコピー（1行目）, type: string }
      - { name: heroTitleLine2, label: キャッチコピー（2行目・色付き）, type: string }
      - { name: heroText, label: 説明文, type: text }
  - name: company
    label: 会社案内
    type: file
    path: content/company.json
    fields:
      - { name: detailTitle, label: 詳細セクションの見出し, type: string }
      - { name: detail1Title, label: 詳細1の見出し, type: string }
      - { name: detail1Text, label: 詳細1の本文, type: text }
      - { name: detail2Title, label: 詳細2の見出し, type: string }
      - { name: detail2Text, label: 詳細2の本文, type: text }
      - { name: bannerImage, label: バナー画像, type: image }
      - { name: headingLine1, label: 見出し（1行目）, type: string }
      - { name: headingLine2, label: 見出し（2行目）, type: string }
      - { name: lead, label: リード文, type: text }
      - { name: companyName, label: 会社名, type: string }
      - { name: address, label: 所在地, type: string }
      - { name: established, label: 設立, type: string }
      - { name: representative, label: 代表者, type: string }
      - { name: businessArea, label: 事業領域, type: string }
      - { name: otherInfoLabel, label: 追加情報の項目名, type: string }
      - { name: otherInfo, label: 追加情報の内容, type: string }
      - { name: valueLine1, label: 大切にする価値（1行目）, type: string }
      - { name: valueLine2, label: 大切にする価値（2行目）, type: string }
  - name: business
    label: 事業内容
    type: file
    path: content/business.json
    fields:
